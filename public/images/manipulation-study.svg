<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" fill="none">
  <title>SO-101 manipulation — conceptual engineering study</title>
  <desc>An original illustrative robot arm reaching toward a rack of centrifuge tubes. This is a conceptual drawing, not a photograph of the actual experiment.</desc>
  <defs>
