  <g fill="#ebe9df" font-family="monospace" font-size="13" letter-spacing="2">
    <text x="48" y="52">01 / MANIPULATION STUDY</text>
    <text x="1152" y="52" text-anchor="end" fill="#f14b50">SO-101 / ACT</text>
    <text x="653" y="146" font-size="11" fill-opacity=".65">ARTICULATED MOTION</text>
    <text x="510" y="579" font-size="11" fill-opacity=".65">POLICY → ACTION</text>
    <text x="973" y="427" font-size="11" fill-opacity=".65">GRASP</text>
    <text x="48" y="804" font-size="11" fill-opacity=".55">DEMONSTRATION → LEARNING → DEPLOYMENT</text>
    <text x="1152" y="804" text-anchor="end" font-size="11" fill-opacity=".55">CONCEPT ILLUSTRATION</text>
  </g>
</svg>
