    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ebe9df" fill-opacity=".1"/></pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebe9df" stop-opacity=".07"/><stop offset="1" stop-color="#ebe9df" stop-opacity="0"/></linearGradient>
  </defs>
  <path fill="#151510" d="M0 0h1200v850H0z"/>
  <path fill="url(#dots)" d="M0 0h1200v850H0z"/>
